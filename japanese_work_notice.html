<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>届書</title>
<style>
  :root { --ink:#687078; --line:#8a9094; --paper:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 16px 40px; background:#e8e8e5; color:var(--ink); font-family:"Yu Gothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif; }
  .toolbar { max-width:850px; margin:0 auto 14px; display:flex; gap:8px; justify-content:flex-end; }
  button { border:1px solid #9ba0a3; border-radius:4px; background:#fff; color:#333; padding:9px 14px; font-size:14px; cursor:pointer; }
  button:hover { background:#f2f3f3; }
  .sheet { width:min(100%, 760px); min-height:1080px; margin:0 auto; background:var(--paper); padding:56px 54px 38px; box-shadow:0 5px 22px #00000017; }
  h1 { font-size:25px; font-weight:400; letter-spacing:1.1em; text-align:center; padding-left:1.1em; margin:0 auto 18px; width:210px; border-bottom:2px solid var(--line); line-height:1.4; }
  table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:17px; }
  td, th { border:1px solid var(--line); height:40px; padding:3px 5px; font-weight:400; }
  .mark { width:8%; text-align:center; }
  .mark input { appearance:none; width:18px; height:18px; border:1px solid transparent; border-radius:50%; margin:0; vertical-align:middle; cursor:pointer; }
  .mark input:checked { border:2px solid #5d646a; }
  .category { width:24%; text-align:center; letter-spacing:.4em; white-space:nowrap; }
  .vertical { width:6%; text-align:center; padding:0; }
  .datearea { width:47%; padding:0; }
  .right { width:15%; text-align:center; }
  .date-row { display:grid; grid-template-columns:repeat(3,1fr); height:39px; align-items:center; text-align:center; }
  .date-row label { display:flex; justify-content:center; align-items:center; gap:3px; white-space:nowrap; }
  input[type="text"], input[type="number"], input[type="date"], input[type="time"], textarea { font:inherit; color:#333; border:0; border-bottom:1px dotted #b5b9bb; background:transparent; outline:none; min-width:0; }
  input:focus, textarea:focus { background:#f6f9fb; border-bottom:1px solid #657b8a; }
  .date-row input { width:50px; font-size:14px; text-align:center; }
  .date-row input[type=date] { width:100%; border:0; font-size:12px; }
  .time-cell { text-align:center; }
  .time-line { display:flex; align-items:center; justify-content:space-evenly; gap:4px; white-space:nowrap; }
  .time-line input { width:52px; text-align:center; font-size:15px; }
  .time-line .ampm { font-size:15px; }
  .reason-label { width:100%; height:34px; padding:5px 8px; border-bottom:1px solid var(--line); }
  .reason { width:100%; height:202px; resize:vertical; display:block; border:0; padding:8px; font-size:15px; }
  .processing { height:42px; display:flex; align-items:center; gap:8px; }
  .processing span { width:70px; padding-left:5px; }
  .processing input { flex:1; margin-right:6px; }
  .note { font-size:14px; margin:7px 0 36px; }
  .note::before { content:"●"; color:#59728b; margin-right:7px; }
  .submission { display:flex; justify-content:flex-end; align-items:center; gap:10px; margin:0 0 30px; font-size:16px; }
  .submission input { width:55px; text-align:center; font-size:14px; }
  .submission input[type=date] { width:155px; }
  .employee { display:grid; grid-template-columns:1fr 1fr; align-items:end; gap:24px; margin:0 0 35px; }
  .employee .seal-label { text-align:right; padding-right:4px; }
  .employee .number { text-align:center; font-size:19px; white-space:nowrap; }
  .employee .number input { width:110px; font-size:16px; }
  .signature { display:grid; grid-template-columns:1fr 1fr 34px; align-items:end; gap:10px; border-bottom:1px solid var(--line); padding-bottom:5px; }
  .signature label { display:flex; gap:8px; align-items:center; font-size:15px; }
  .signature input { width:100%; font-size:16px; }
  .stamp { text-align:center; font-size:18px; }
  .approval { display:grid; grid-template-columns:1fr 1fr; gap:36px; margin-top:18px; }
  .approval-title { font-size:14px; margin-bottom:5px; }
  .stamp-box { display:grid; grid-template-columns:repeat(4,1fr); height:74px; border:1px solid var(--line); }
  .stamp-box div { border-right:1px solid var(--line); }
  .stamp-box div:last-child { border-right:0; }
  .small-print { font-size:10px; margin-top:4px; color:#92979a; }
  @media (max-width:600px) {
    body { padding:10px 0 20px; }
    .toolbar { padding:0 10px; }
    .sheet { width:100%; min-height:0; padding:28px 15px 24px; box-shadow:none; }
    h1 { font-size:22px; }
    table { font-size:12px; }
    td,th { height:35px; padding:2px; }
    .category { letter-spacing:.15em; }
    .date-row input { width:38px; }
    .time-line input { width:35px; font-size:12px; }
    .time-line .ampm { font-size:11px; }
    .reason { height:160px; }
    .note { margin-bottom:25px; }
    .submission { font-size:12px; gap:4px; }
    .submission input { width:34px; }
    .submission input[type=date] { width:125px; }
    .employee { gap:8px; margin-bottom:26px; }
    .employee .number { font-size:14px; }
    .employee .number input { width:65px; }
    .signature { grid-template-columns:1fr 1fr 20px; gap:4px; }
    .signature label { font-size:12px; gap:3px; }
    .approval { gap:12px; }
    .stamp-box { height:60px; }
  }
  @media print {
    @page { size:A4 portrait; margin:8mm; }
    body { background:#fff; padding:0; }
    .toolbar { display:none; }
    .sheet { width:100%; min-height:0; box-shadow:none; padding:8mm 10mm; }
    input, textarea { print-color-adjust:exact; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">印刷 / Print</button>
    <button type="button" onclick="clearForm()">入力をクリア / Clear</button>
  </div>
  <main class="sheet">
    <h1>届　書</h1>
    <table aria-label="届書フォーム">
      <colgroup><col class="mark"><col class="category"><col class="vertical"><col class="datearea"><col class="right"></colgroup>
      <tr>
        <td class="mark"><input type="radio" name="kind" aria-label="有給休暇"></td><td class="category">有給休暇</td>
        <td class="vertical" rowspan="3">期<br><br>日</td>
        <td class="datearea" rowspan="3">
          <div class="date-row"><label> <input type="text" placeholder="　" aria-label="開始年">年</label><label><input type="text" placeholder="　" aria-label="開始月">月</label><label><input type="text" placeholder="　" aria-label="開始日">日から</label></div>
          <div class="date-row"><label><input type="text" aria-label="終了年">年</label><label><input type="text" aria-label="終了月">月</label><label><input type="text" aria-label="終了日">日まで</label></div>
        </td><td class="right" rowspan="3" style="vertical-align:bottom"> <input type="text" aria-label="日数" style="width:35px;text-align:center"> 日間</td>
      </tr>
      <tr><td class="mark"><input type="radio" name="kind" aria-label="特別休暇"></td><td class="category">特別休暇</td></tr>
      <tr><td class="mark"><input type="radio" name="kind" aria-label="代休"></td><td class="category">代　休</td></tr>
      <tr>
        <td class="mark"><input type="radio" name="kind" aria-label="欠勤"></td><td class="category">欠　勤</td>
        <td class="vertical" rowspan="2">時<br><br>間</td>
        <td colspan="2" class="time-cell"><div class="time-line"><span class="ampm">午前・後</span><input type="text" aria-label="開始時刻 時" maxlength="2">時<input type="text" aria-label="開始時刻 分" maxlength="2">分から</div></td>
      </tr>
      <tr><td class="mark"></td><td class="category"></td><td colspan="2" class="time-cell"><div class="time-line"><span class="ampm">午前・後</span><input type="text" aria-label="終了時刻 時" maxlength="2">時<input type="text" aria-label="終了時刻 分" maxlength="2">分まで</div></td></tr>
      <tr><td class="mark"><input type="radio" name="kind" aria-label="遅刻"></td><td class="category">遅　刻</td><td colspan="2" rowspan="7" style="padding:0;vertical-align:top"><div class="reason-label">事由 / 行先</div><textarea class="reason" aria-label="事由・行先"></textarea></td><td rowspan="2" style="text-align:center;vertical-align:bottom"> <input type="text" aria-label="時間数" style="width:30px;text-align:center"> 時間<br><input type="text" aria-label="分数" style="width:30px;text-align:center"> 分</td></tr>
      <tr><td class="mark"><input type="radio" name="kind" aria-label="早退"></td><td class="category">早　退</td></tr>
      <tr><td class="mark"><input type="radio" name="kind" aria-label="早出"></td><td class="category">早　出</td><td class="right"></td></tr>
      <tr><td class="mark"><input type="radio" name="kind" aria-label="残業"></td><td class="category">残　業</td><td class="right"></td></tr>
      <tr><td class="mark"><input type="radio" name="kind" aria-label="休日出勤"></td><td class="category">休日出勤</td><td class="right"></td></tr>
      <tr><td class="mark"><input type="radio" name="kind" aria-label="外出"></td><td class="category">外　出</td><td class="right"></td></tr>
      <tr><td class="mark"><input type="radio" name="kind" aria-label="出張"></td><td class="category">出　張</td><td class="right" style="height:42px"><div class="processing"><span>処理</span><input type="text" aria-label="処理欄"></div></td></tr>
    </table>
    <p class="note">該当する欄に○印をつけること</p>
    <div class="submission">提出日 <input type="text" aria-label="提出年" placeholder="年">年 <input type="text" aria-label="提出月" placeholder="月">月 <input type="text" aria-label="提出日" placeholder="日">日</div>
    <div class="employee">
      <div class="seal-label">殿</div>
      <div class="number">社員No. <input type="text" aria-label="社員番号"></div>
    </div>
    <div class="signature">
      <label>所属 <input type="text" aria-label="所属"></label>
      <label>氏名 <input type="text" aria-label="氏名"></label>
      <div class="stamp">印</div>
    </div>
    <div class="approval">
      <div><div class="approval-title">人事印</div><div class="stamp-box"><div></div><div></div><div></div><div></div></div></div>
      <div><div class="approval-title">所属長印</div><div class="stamp-box"><div></div><div></div><div></div><div></div></div></div>
    </div>
    <div class="small-print">コクヨ　フォーム No.190</div>
  </main>
<script>
  function clearForm() {
    if (!confirm('入力内容をすべてクリアしますか？')) return;
    document.querySelectorAll('input').forEach(el => {
      if (el.type === 'radio' || el.type === 'checkbox') el.checked = false;
      else el.value = '';
    });
    document.querySelectorAll('textarea').forEach(el => el.value = '');
  }
</script>
</body>
</html>
