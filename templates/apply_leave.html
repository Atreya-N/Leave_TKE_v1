
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for Leave | LeaveFlow</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='apply_leave_style.css') }}">
</head>

<body class="apply-body">

    <!-- NAVIGATION BAR -->
    <header class="apply-navbar">

        <div class="apply-navbar-logo">
            <span class="apply-navbar-icon">L</span>
            <span>LeaveFlow</span>
        </div>

        <!-- DYNAMIC PORTAL LABEL -->
        <span class="apply-navbar-label">

            {% if session.get("role") == "manager" %}
                Manager Portal
            {% else %}
                Employee Portal
            {% endif %}

        </span>

    </header>


    <!-- MAIN PAGE -->
    <main class="apply-page">

        <!-- PAGE HEADING -->
        <div class="apply-heading">

            <!-- DYNAMIC BACK TO DASHBOARD LINK -->
            <a href="{{ url_for('manager_dashboard') if session.get('role') == 'manager' else url_for('dashboard') }}"
               class="apply-back">

                <svg viewBox="0 0 24 24"
                     width="16"
                     height="16"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round"
                     stroke-linejoin="round">

                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>

                </svg>

                <span>Dashboard</span>

            </a>

            <h1>Apply for Leave</h1>

            <p>
                Fill in the details below to submit your leave application.
            </p>

        </div>


        <!-- APPLICATION CARD -->
        <section class="apply-card">

            <div class="apply-card-header">

                <h2>New Leave Application</h2>

                <p>
                    Please provide the required information below.
                </p>

            </div>


            <!-- LEAVE APPLICATION FORM -->
            <form action="{{ url_for('apply_leave') }}"
                  method="POST"
                  class="apply-form">


                <!-- LEAVE TYPE -->
                <div class="apply-field">

                    <label for="leave_type">
                        Leave Type
                    </label>

                    <select id="leave_type"
                            name="leave_type"
                            required>

                        <option value="" disabled selected>
                            Select leave type
                        </option>

                        <option value="Annual Leave">
                            Annual Leave
                        </option>

                        <option value="Sick Leave">
                            Sick Leave
                        </option>

                        <option value="Personal Leave">
                            Personal Leave
                        </option>

                        <option value="Other">
                            Other
                        </option>

                    </select>

                </div>


                <!-- DATE FIELDS -->
                <div class="apply-date-row">

                    <div class="apply-field">

                        <label for="start_date">
                            Start Date
                        </label>

                        <input type="date"
                               id="start_date"
                               name="start_date"
                               required>

                    </div>


                    <div class="apply-field">

                        <label for="end_date">
                            End Date
                        </label>

                        <input type="date"
                               id="end_date"
                               name="end_date"
                               required>

                    </div>

                </div>


                <!-- REASON -->
                <div class="apply-field">

                    <label for="reason">
                        Reason for Leave
                    </label>

                    <textarea id="reason"
                              name="reason"
                              rows="5"
                              placeholder="Please enter the reason for your leave..."
                              required></textarea>

                </div>


                <!-- FORM ACTIONS -->
                <div class="apply-actions">

                    <!-- DYNAMIC CANCEL BUTTON -->
                    <a href="{{ url_for('manager_dashboard') if session.get('role') == 'manager' else url_for('dashboard') }}"
                       class="apply-cancel-btn">

                        Cancel

                    </a>


                    <!-- SUBMIT BUTTON -->
                    <button type="submit" class="apply-submit-btn">

                        Submit Application

                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="apply-footer">

        <p>LeaveFlow &copy; 2026</p>

    </footer>

</body>

</html>
